<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BSE RSS Reader & Watchlist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>BSE RSS Reader</h1>
  </header>

  <main>
    <section class="controls">
      <input type="text" id="company-input" placeholder="Enter company name or ticker">
      <button id="add-btn">Add Company</button>
      <button id="clear-btn">Clear Watchlist</button>
    </section>

    <section>
      <h2>Saved Watchlist</h2>
      <div id="watchlist-container" class="watchlist-container"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
